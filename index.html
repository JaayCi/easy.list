ight:750}.status.missing{background:#fff0dc;color:#9b5a0d}.mini{border:0;background:transparent;color:#817982;font-size:20px;cursor:pointer;padding:6px}.empty{text-align:center;color:#817982;padding:40px 10px}.sheetback{position:fixed;inset:0;background:#31212e88;display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet{background:var(--surface,white);border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:600px;max-height:90vh;overflow:auto}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13px;font-weight:700}.field input,.field select{width:100%}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}.stats{display:flex;gap:10px}.stats .panel{flex:1}.stats strong{display:block;font-size:26px}.hidden{display:none!important}body.dark{--surface:#302a33;background:#201d23;color:#f8f1f6}body.dark .panel{background:#302a33;border-color:#514552}body.dark .muted,body.dark .grouphead,body.dark .itemname small{color:#c5b5c2}body.dark .item{border-color:#514552}body.dark .tabs{border-color:#514552}body.dark .tabs button.active{background:#5c364e;color:#ffd2e7}body.dark .input,body.dark select{border-color:#6b5967}body.dark .status{background:#59364d;color:#ffcee4}body.dark .status.missing{background:#533c23;color:#ffd69b}

</style></head><body><main class="shell"><header><div><div class="identity"><h1>easy<span>.list</span></h1></div><div class="muted brand-subtitle">Dein Zuhause. Deine Liste.</div></div></header><div class="stats hidden" id="legacyStats"><div class="panel"><span class="muted">Standardartikel</span><strong id="total">0</strong></div><div class="panel"><span class="muted">Einkaufen</span><strong id="needed">0</strong></div></div><section id="view"></section></main><nav class="tabs"><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="stock">▤<br>Vorräte</button><button data-tab="shopping">▣<br>Einkauf</button><button data-tab="settings">⚙<br>Einstellungen</button></nav><div id="modal"></div><script>
const KEY='easyliste_beta1',defaults={categories:[{id:'food',name:'Lebensmittel',subs:['Gemüse','Früchte','Milchprodukte','Fleisch & Fisch','Getränke','Vorrat']},{id:'home',name:'Haushalt',subs:['Papierwaren','Reinigung','Wäsche','Küche']},{id:'care',name:'Körperpflege',subs:['Dusche','Zahnpflege','Haarpflege']},{id:'pets',name:'Haustiere',subs:['Futter','Pflege']},{id:'other',name:'Sonstiges',subs:['Allgemein']}],items:[],dark:false,firstName:''};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)}if(!Array.isArray(state.items)||!Array.isArray(state.categories))state=structuredClone(defaults);let tab='home',query='',categoryFilter='all';const $=s=>document.querySelector(s),uid=()=>((typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')?crypto.randomUUID():String(Date.now())+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Lokale Speicherung nicht verfügbar',e)}render()},cat=id=>state.categories.find(c=>c.id===id),label=i=>`${cat(i.cat)?.name||'Sonstiges'} · ${i.sub||'Allgemein'}`;function render(){const firstName=String(state.firstName||'').trim();document.body.classList.toggle('dark',!!state.dark);$('#total').textContent=state.items.filter(i=>!i.temporary).length;$('#needed').textContent=state.items.filter(i=>i.missing).length;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=$('#view');if(tab==='home'){
const missing=state.items.filter(i=>i.missing), total=state.items.filter(i=>!i.temporary).length;

<div class="summary"><div class="summarybox"><strong>${total}</strong><span>Standardartikel</span></div><div class="summarybox"><strong>${Math.max(0,total-state.items.filter(i=>i.missing&&!i.temporary).length)}</strong><span>Vorhanden</span></div></div>
<div class="section-title"><h2>Meine Kategorien</h2><button class="textbtn" id="manageCategories">Verwalten</button></div>
<div class="catgrid">${state.categories.map(c=>`<button class="catcard" data-home-cat="${esc(c.id)}"><span class="catemoji">${iconFor(c.id)}</span><strong>${esc(c.name)}</strong><small>${state.items.filter(i=>i.cat===c.id&&i.missing).length} fehlen</small></button>`).join('')}</div>`;
$('#goShopping').onclick=()=>{tab='shopping';render()};
$('#manageCategories').onclick=()=>{tab='settings';render()};

}else if(tab==='stock'){
let items=state.items.filter(i=>!i.temporary&&(categoryFilter==='all'||i.cat===categoryFilter)&&(`${i.name} ${label(i)}`).toLowerCase().includes(query.toLowerCase()));
v.innerHTML=`<div class="panel"><h2>Meine Vorräte</h2><div class="muted">Deine dauerhafte Standardliste. Tippe auf «Da», wenn etwas fehlt.</div><div class="toolbar"><input class="input" id="search" placeholder="Artikel suchen …" value="${esc(query)}"><button class="btn" id="add">+ Artikel</button></div><div class="filterbar"><button class="filter ${categoryFilter==='all'?'selected':''}" data-filter="all">Alle</button>${state.categories.map(c=>`<button class="filter ${categoryFilter===c.id?'selected':''}" data-filter="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>${list(items,false)}</div>`;
$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};
$('#add').onclick=()=>itemForm();
v.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{categoryFilter=b.dataset.filter;render()});
}else if(tab==='shopping'){

v.innerHTML=`<div class="panel"><h2>Einkaufsliste <span class="countbubble">${items.length}</span></h2><div class="muted">Tippe auf «Gekauft», sobald der Artikel im Wagen liegt.</div><div class="toolbar"><button class="btn" id="add">+ Einmaligen Artikel hinzufügen</button></div>${list(items,true)}</div>`;
$('#add').onclick=()=>itemForm(null,true)
}else{v.innerHTML=`<div class="panel"><h2>⚙ Einstellungen</h2><div class="muted">Passe easy.list ganz nach deinen Wünschen an.</div><div class="settings-row"><div><strong>Dein Vorname</strong><div class="muted">${esc(firstName||'Noch kein Name')}</div></div><button class="btn secondary" id="settingsRename">Name ändern</button></div><div class="settings-row"><div><strong>Darstellung</strong><div class="muted">Wähle dein bevorzugtes Design</div></div><div class="appearance" role="group" aria-label="Darstellung"><button type="button" data-appearance="light" class="${!state.dark?'chosen':''}">☀ Hell</button><button type="button" data-appearance="dark" class="${state.dark?'chosen':''}">☾ Dunkel</button></div></div></div><div class="panel"><h2>Kategorien verwalten</h2><div class="muted">Verwalte Kategorien und Unterkategorien.</div><div class="toolbar"><button class="btn" id="addcat">+ Kategorie</button></div>${state.categories.map(c=>`<div class="group"><div class="item"><div class="itemname"><strong>${esc(c.name)}</strong><small>${c.subs.map(esc).join(' · ')}</small></div><button class="mini" data-cat-edit="${esc(c.id)}" aria-label="Kategorie bearbeiten">✎</button></div></div>`).join('')}</div>`;$('#settingsRename').onclick=()=>nameForm(false);v.querySelectorAll('[data-appearance]').forEach(b=>b.onclick=()=>{state.dark=b.dataset.appearance==='dark';save()});$('#addcat').onclick=()=>catForm();v.querySelectorAll('[data-cat-edit]').forEach(b=>b.onclick=()=>catForm(cat(b.dataset.cat)))}v.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const i=state.items.find(x=>x.id===b.dataset.toggle);if(!i)return;if(i.temporary){state.items=state.items.filter(x=>x.id!==i.id)}else if(i.missing){i.stockQty=Math.max(1,Number(i.minQty)||1);i.missing=false}else{i.stockQty=0;i.missing=true}save()});v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemForm(state.items.find(x=>x.id===b.dataset.edit)))}function list(items,shopping){if(!items.length)return `<div class="empty">${shopping?'Alles erledigt! Deine Einkaufsliste ist leer.':'Noch keine Artikel vorhanden. Füge deinen ersten Artikel hinzu.'}</div>`;let groups={};items.forEach(i=>{let k=label(i);(groups[k]??=[]).push(i)});return Object.entries(groups).sort(([a],[b])=>a.localeCompare(b,'de')).map(([k,arr])=>`<div class="group"><div class="grouphead">${esc(k)}</div>${arr.map(i=>`<div class="item"><div class="itemname"><strong>${esc(i.name)}</strong><small>${esc(i.qty||'1 Stück')}${shopping&&!i.temporary&&i.minQty?` · ${Math.max(1,(Number(i.minQty)||1)-(Number(i.stockQty)||0))} nachkaufen`:''}${i.temporary?' · Einmalig':''}</small></div><button class="status ${i.missing?'missing':''}" data-toggle="${esc(i.id)}">${shopping?'✓ Gekauft':i.missing?'↻ Fehlt': '✓ Da'}</button>${shopping?'':`<button class="mini" data-edit="${esc(i.id)}" aria-label="Artikel bearbeiten">⋯</button>`}</div>`).join('')}</div>`).join('')}function close(){$('#modal').innerHTML=''}function show(html){$('#modal').innerHTML=`<div class="sheetback"><div class="sheet">${html}</div></div>`;$('.sheetback').onclick=e=>{if(e.target.classList.contains('sheetback'))close()}}function itemForm(i=null,temporary=false){let c=i?.cat||state.categories[0]?.id;show(`<h2>${i?'Artikel bearbeiten':temporary?'Einmaliger Einkauf':'Artikel hinzufügen'}</h2><form id="itemform"><label class="field">Artikelname<input class="input" name="name" maxlength="90" required value="${esc(i?.name||'')}" placeholder="z. B. Milch"></label><label class="field">Menge / Einheit<input class="input" name="qty" maxlength="45" value="${esc(i?.qty||'1 Stück')}" placeholder="z. B. 2 Liter"></label><div class="quantity-grid"><label class="field">Mindestbestand<input class="input" type="number" name="minQty" min="1" max="9999" value="${esc(i?.minQty??1)}" required></label><label class="field">Aktuell vorhanden<input class="input" type="number" name="stockQty" min="0" max="9999" value="${esc(i?.stockQty??(i?.missing?0:1))}" required></label></div><label class="field">Kategorie<select name="cat" id="catselect">${state.categories.map(x=>`<option value="${esc(x.id)}" ${x.id===c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">Unterkategorie<select name="sub" id="subselect"></select></label><div class="actions"><button class="btn secondary" type="button" id="cancel">Abbrechen</button><button class="btn" type="submit">Speichern</button></div>${i?'<button class="btn ghost" type="button" id="delete" style="margin-top:12px;color:#c04c67">Artikel löschen</button>':''}</form>`);function subs(){let opts=cat($('#catselect').value)?.subs||['Allgemein'];$('#subselect').innerHTML=opts.map(x=>`<option ${x===i?.sub?'selected':''}>${esc(x)}</option>`).join('')}subs();$('#catselect').onchange=subs;$('#cancel').onclick=close;$('#itemform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let data={id:i?.id||uid(),name,qty:String(f.get('qty')).trim(),minQty:Math.max(1,Number(f.get('minQty'))||1),stockQty:Math.max(0,Number(f.get('stockQty'))||0),cat:f.get('cat'),sub:f.get('sub'),missing:temporary?true:(Number(f.get('stockQty'))<Number(f.get('minQty'))),temporary:i?.temporary??temporary};if(i)Object.assign(i,data);else state.items.push(data);close();save()};if(i)$('#delete').onclick=()=>{if(confirm('Diesen Artikel wirklich löschen?')){state.items=state.items.filter(x=>x.id!==i.id);close();save()}}}function catForm(c=null){show(`<h2>${c?'Kategorie bearbeiten':'Neue Kategorie'}</h2><form id="catform"><label class="field">Name<input class="input" name="name" maxlength="60" required value="${esc(c?.name||'')}"></label><label class="field">Unterkategorien (durch Kommas trennen)<input class="input" name="subs" value="${esc(c?.subs.join(', ')||'Allgemein')}"></label><div class="actions"><button type="button" class="btn secondary" id="cancel">Abbrechen</button><button class="btn" type="submit">Speichern</button></div>${c?'<button class="btn ghost" id="dele lt();let name=String(new FormData(e.target).get('firstName')||'').trim();if(!name)return;state.firstName=name;close();save()};if(!first)$('#cancelname').onclick=close;$('#nameform input')?.focus()}render();if(!String(state.firstName||'').trim())nameForm(true);if(location.protocol.startsWith('http') && "serviceWorker" in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
